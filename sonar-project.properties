# SonarQube configuration
sonar.projectKey=ecommerce-platform
sonar.projectName=E-Commerce Platform
sonar.projectVersion=1.0.0

# Source directories
sonar.sources=frontend/src,product-service/src,cart-service/src,order-service/src,payment-service/src

# Test directories
sonar.tests=frontend/src,product-service/src,cart-service/src,order-service/src,payment-service/src

# Test file patterns
sonar.test.inclusions=**/*.test.js,**/*.test.ts

# Exclusions
sonar.exclusions=**/node_modules/**,**/build/**,**/coverage/**,**/*.min.js

# Language
sonar.language=js

# JavaScript analysis
sonar.javascript.lcov.reportPaths=coverage/lcov.info

# Encoding
sonar.sourceEncoding=UTF-8
